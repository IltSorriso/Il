# GitHub Actions — o juiz em máquina oficial.
# Ordem imposta pelo desenho:
#   1. o HASH (Sha256) compila;
#   2. o SPEC (Bolha) importa o hash e define a forma + o endereçamento;
#   3. a PONTE importa o spec (fonte única de verdade);
#   4. a CONFORMIDADE roda o juiz sobre os artefatos REAIS.
# A versão do Lean fica fixada em lean-toolchain.
name: verificar-juiz

# A permissão extra serve para PUBLICAR O NÚMERO como estado do compromisso:
# assim a prova fica legível por qualquer um, sem credencial nenhuma.
permissions:
  contents: read
  statuses: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  juiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Lean 4 (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: O hash — Sha256.lean
        working-directory: juiz
        run: |
          lean --version
          lean -o Sha256.olean Sha256.lean

      - name: O spec — Bolha.lean (importa o hash)
        working-directory: juiz
        run: |
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          lean -o Bolha.olean Bolha.lean

      - name: A ponte — Ponte.lean (importa o spec)
        working-directory: juiz
        run: |
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          lean -o Ponte.olean Ponte.lean

      - name: O fluxo da música — a mão escreve as partes e a bolha da canção
        # A letra de exemplo vive em `exemplos/musica/letra.txt`: é PRODUTO do
        # tronco e não carrega conteúdo de ninguém. O fluxo escreve no depósito
        # local; o juiz, no passo seguinte, confere o que a mão escreveu.
        run: |
          python3 arreio.py musica exemplos/musica/letra.txt \
            --titulo "Canção de exemplo" --interprete "Exemplo"

      - name: Conformidade — o juiz sobre os artefatos reais

        run: |
          export LEAN_PATH="juiz${LEAN_PATH:+:$LEAN_PATH}"
          lean --run juiz/Conformidade.lean 2>&1 | tee prova.txt

      - name: Publicar o número do juiz (legível sem credencial)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(grep -oiE '[0-9]+ *confer[^.]*falhas?' prova.txt | tail -1)
          if [ -z "$NUM" ]; then NUM=$(grep -v '^$' prova.txt | tail -2 | tr '\n' ' ' | cut -c1-130); fi
          if [ -z "$NUM" ]; then NUM="(sem saida capturada)"; fi
          jq -n --arg d "$NUM" --arg e "${{ job.status }}" '{state:$e,context:"juiz - numero",description:$d}' > corpo.json
          curl -sS -o /dev/null -w "estado publicado: %{http_code}\n" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data @corpo.json

  prosa:
    # O juiz da FORMA dos documentos. Nao julga o conteudo — isso e conversa
    # humana. Julga o que da para decidir: tipo declarado, nenhum termo morto
    # em quem afirma o presente, caminho apontado que existe de fato, e so a
    # capa morando na raiz. O mapa e GERADO aqui, nunca versionado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Higiene da prosa
        run: python3 higiene.py --mapa 2>&1 | tee prova.txt

      - name: Publicar o número da prosa (legível sem credencial)
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(grep -oiE '[0-9]+ *documento[^.]*falhas?' prova.txt | tail -1)
          if [ -z "$NUM" ]; then NUM=$(grep -v '^$' prova.txt | tail -2 | tr '\n' ' ' | cut -c1-130); fi
          if [ -z "$NUM" ]; then NUM="(sem saida capturada)"; fi
          jq -n --arg d "$NUM" --arg e "${{ job.status }}" '{state:$e,context:"prosa - numero",description:$d}' > corpo.json
          curl -sS -o /dev/null -w "estado publicado: %{http_code}\n" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data @corpo.json
