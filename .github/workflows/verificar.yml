# GitHub Actions — a execução do juiz em máquina oficial.
# Roda exatamente o comando verificado localmente: `lean juiz/Bolha.lean`
# (exit 0 com Lean 4.33.1). A versão fica fixada em lean-toolchain.
name: verificar-juiz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  juiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Lean 4 (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: O juiz confere
        run: |
          lean --version
          lean juiz/Bolha.lean
