# GitHub Actions — o juiz em máquina oficial.
# Ordem imposta pelo desenho:
#   1. o HASH (Sha256) compila;
#   2. o SPEC (Bolha) importa o hash e define a forma + o endereçamento;
#   3. a PONTE importa o spec (fonte única de verdade);
#   4. a CONFORMIDADE roda o juiz sobre os artefatos REAIS.
# A versão do Lean fica fixada em lean-toolchain.
name: verificar-juiz

# A permissão extra serve para PUBLICAR O NÚMERO como estado do compromisso:
# assim a prova fica legível por qualquer um, sem credencial nenhuma.
permissions:
  contents: read
  statuses: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  juiz:
    # A cadeia é DEFINIDA em ferramentas/reproduzir-cadeia.sh — o mesmo programa
    # que a máquina própria roda. O fluxo não repete os passos: ele chama.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A cadeia do juiz (definida em ferramentas/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ferramentas/reproduzir-cadeia.sh --etapa juiz --publicar
      - name: A conta por dentro (a decomposição do número)
        # O NÚMERO SOZINHO É CAIXA PRETA. 104 conferências não dizem de onde
        # vieram, e número que ninguém consegue decompor não é auditável. A
        # cadeia já grava cada prova em prova-<etapa>.txt — aqui ela é DITA EM
        # VOZ ALTA. Isto é observabilidade, não prova: quem prova é o juiz.
        if: always()
        run: |
          for arq in prova-*.txt; do
            [ -e "$arq" ] || continue
            echo "===== $arq ====="
            cat "$arq"
            echo
          done

      - name: Guardar as provas
        # Artefato é o que sobra depois que o log rola. Enquanto o número não
        # for decomponível DENTRO do juiz, o arquivo cru é a única testemunha.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provas-do-juiz
          path: prova-*.txt
          if-no-files-found: warn

  prazos:
    # A5 cobrada por máquina. Publica ESTADO e não derruba a pindorama: a A6 manda o
    # pindorama nunca quebrar, e ramo vencido é dívida de processo, não defeito do produto.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A5 — prazos dos ramos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ferramentas/fiscal-de-prazos.mjs
  prosa:
    # O juiz da FORMA dos documentos — também pela cadeia única.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: A higiene da prosa (definida em ferramentas/)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ferramentas/reproduzir-cadeia.sh --etapa prosa --publicar
