# GitHub Actions — o juiz em máquina oficial.
# Ordem imposta pelo desenho:
#   1. o SPEC (Bolha) compila primeiro --> olean;
#   2. a PONTE importa o spec (fonte única de verdade), não o redefine;
#   3. a CONFORMIDADE roda o juiz sobre os artefatos REAIS (exemplos/).
# A versão do Lean fica fixada em lean-toolchain.
name: verificar-juiz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  juiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Lean 4 (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: O spec — Bolha.lean
        working-directory: juiz
        run: |
          lean --version
          lean -o Bolha.olean Bolha.lean

      - name: A ponte — Ponte.lean (importa o spec)
        working-directory: juiz
        run: |
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          lean -o Ponte.olean Ponte.lean

      - name: Conformidade — o juiz sobre os artefatos reais
        run: |
          export LEAN_PATH="juiz${LEAN_PATH:+:$LEAN_PATH}"
          lean --run juiz/Conformidade.lean
