# GitHub Actions — o juiz em máquina oficial.
# Ordem imposta pelo desenho:
#   1. o HASH (Sha256) compila;
#   2. o SPEC (Bolha) importa o hash e define a forma + o endereçamento;
#   3. a PONTE importa o spec (fonte única de verdade);
#   4. a CONFORMIDADE roda o juiz sobre os artefatos REAIS.
# A versão do Lean fica fixada em lean-toolchain.
name: verificar-juiz

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  juiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Lean 4 (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: O hash — Sha256.lean
        working-directory: juiz
        run: |
          lean --version
          lean -o Sha256.olean Sha256.lean

      - name: O spec — Bolha.lean (importa o hash)
        working-directory: juiz
        run: |
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          lean -o Bolha.olean Bolha.lean

      - name: A ponte — Ponte.lean (importa o spec)
        working-directory: juiz
        run: |
          export LEAN_PATH=".${LEAN_PATH:+:$LEAN_PATH}"
          lean -o Ponte.olean Ponte.lean

      - name: Conformidade — o juiz sobre os artefatos reais
        run: |
          export LEAN_PATH="juiz${LEAN_PATH:+:$LEAN_PATH}"
          lean --run juiz/Conformidade.lean

  prosa:
    # O juiz da FORMA dos documentos. Nao julga o conteudo — isso e conversa
    # humana. Julga o que da para decidir: tipo declarado, nenhum termo morto
    # em quem afirma o presente, caminho apontado que existe de fato, e so a
    # capa morando na raiz. O mapa e GERADO aqui, nunca versionado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Higiene da prosa
        run: python3 higiene.py --mapa
